<div class="task-list-container">
    <div class="header">
        <h2>Task Manager</h2>
        <button mat-raised-button color="primary" (click)="openAddDialog()">
            <mat-icon>add</mat-icon> Add Task
        </button>
    </div>

    <app-task-filter (filterChange)="loadTasks()"></app-task-filter>

    <div *ngIf="loading" class="loading-spinner">
        <mat-spinner></mat-spinner>
    </div>

    <div *ngIf="error" class="error-message">
        Failed to load tasks. Please try again.
    </div>

    <div *ngIf="!loading && !error">
        <table mat-table [dataSource]="tasks" class="mat-elevation-z8">
            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Name </th>
                <td mat-cell *matCellDef="let task"> {{task.name}} </td>
            </ng-container>

            <!-- Description Column -->
            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef> Description </th>
                <td mat-cell *matCellDef="let task"> {{task.description || '-'}} </td>
            </ng-container>

            <!-- Priority Column -->
            <ng-container matColumnDef="priority">
                <th mat-header-cell *matHeaderCellDef> Priority </th>
                <td mat-cell *matCellDef="let task">
                    <span [class]="'priority-' + task.priority.toLowerCase()">
                        {{task.priority}}
                    </span>
                </td>
            </ng-container>

            <!-- Due Date Column -->
            <ng-container matColumnDef="dueDate">
                <th mat-header-cell *matHeaderCellDef> Due Date </th>
                <td mat-cell *matCellDef="let task"> {{task.dueDate | date}} </td>
            </ng-container>

            <!-- Status Column -->
            <ng-container matColumnDef="isCompleted">
                <th mat-header-cell *matHeaderCellDef> Status </th>
                <td mat-cell *matCellDef="let task">
                    <mat-slide-toggle [checked]="task.isCompleted" (change)="toggleCompletion(task)" color="primary">
                        {{task.isCompleted ? 'Completed' : 'Incomplete'}}
                    </mat-slide-toggle>
                </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let task">
                    <button mat-icon-button color="primary" (click)="openEditDialog(task)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteTask(task.id)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <div *ngIf="tasks.length === 0" class="no-tasks">
            No tasks found.
        </div>
    </div>
</div>
