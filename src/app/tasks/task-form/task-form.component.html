<form [formGroup]="form" (ngSubmit)="submitForm()" class="task-form">
  <mat-form-field appearance="fill">
    <mat-label>Task Name</mat-label>
    <input matInput formControlName="name" required maxlength="50" />
    <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
    <mat-error *ngIf="form.get('name')?.hasError('maxlength')">Max 50 characters</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Description</mat-label>
    <textarea matInput formControlName="description" maxlength="200"></textarea>
    <mat-hint align="end">{{form.get('description')?.value?.length || 0}} / 200</mat-hint>
    <mat-error *ngIf="form.get('description')?.hasError('maxlength')">Max 200 characters</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Priority</mat-label>
    <mat-select formControlName="priority" required>
      <mat-option value="Low">Low</mat-option>
      <mat-option value="Medium">Medium</mat-option>
      <mat-option value="High">High</mat-option>
    </mat-select>
    <mat-error *ngIf="form.get('priority')?.hasError('required')">Priority is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Due Date</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="dueDate" required />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
    <mat-error *ngIf="form.get('dueDate')?.hasError('required')">Due date is required</mat-error>
    <mat-error *ngIf="form.get('dueDate')?.hasError('notFuture')">Due date must be in the future</mat-error>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Save Task</button>
</form>
