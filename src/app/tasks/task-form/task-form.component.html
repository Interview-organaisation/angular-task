<h2 mat-dialog-title>{{isEditMode ? 'Edit' : 'Add'}} Task</h2>

<mat-dialog-content>
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
        <!-- Name form field -->
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Task Name</mat-label>
            <input matInput formControlName="name" required>
            <mat-error *ngIf="name?.hasError('required')">Name is required</mat-error>
            <mat-error *ngIf="name?.hasError('maxlength')">Name must be less than 50 characters</mat-error>
        </mat-form-field>

        <!-- Description form field -->
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" rows="3"></textarea>
            <mat-error *ngIf="description?.hasError('maxlength')">Description must be less than 200
                characters</mat-error>
        </mat-form-field>

        <!-- Priority form field -->
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Priority</mat-label>
            <mat-select formControlName="priority" required>
                <mat-option *ngFor="let priority of priorities" [value]="priority">
                    {{priority}}
                </mat-option>
            </mat-select>
            <mat-error *ngIf="priority?.hasError('required')">Priority is required</mat-error>
        </mat-form-field>

        <!-- DueDate form field -->
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Due Date</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="dueDate" required>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
            <mat-error>{{dueDateError}}</mat-error>
        </mat-form-field>
    </form>
</mat-dialog-content>

<!-- Form Button Controls -->
<mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!taskForm.valid || loading">
        {{isEditMode ? 'Update' : 'Save'}}
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
    </button>
</mat-dialog-actions>
